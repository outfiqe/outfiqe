services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outfiqe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outfiqe}
      POSTGRES_DB: ${POSTGRES_DB:-outfiqe_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-outfiqe} -d ${POSTGRES_DB:-outfiqe_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
