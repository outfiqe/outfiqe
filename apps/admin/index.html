<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outfiqe Admin</title>
    <style>
      html {
        background: hsl(32 30% 95%);
      }
      body {
        margin: 0;
      }
      html.dark {
        background: hsl(30 22% 8%);
      }
      .boot-loader {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
      }
      .boot-loader-spinner {
        width: 28px;
        height: 28px;
        color: hsl(175 66% 52%);
        animation: boot-loader-spin 1s linear infinite;
      }
      @keyframes boot-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loader-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
    <script>
      (() => {
        var STORAGE_KEY = "outfiqe-theme";
        var DARK_CLASS = "dark";
        try {
          var stored = localStorage.getItem(STORAGE_KEY);
          var isDark = stored
            ? stored === DARK_CLASS
            : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle(DARK_CLASS, isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-label="Loading">
        <svg
          class="boot-loader-spinner"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
