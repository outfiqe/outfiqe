<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outfiqe Admin</title>
    <style>
      html {
        background: hsl(32 30% 95%);
      }
      html.dark {
        background: hsl(30 22% 8%);
      }
      .boot-loader {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
      }
      .boot-loader-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid hsl(175 66% 52% / 0.25);
        border-top-color: hsl(175 66% 52%);
        border-radius: 50%;
        animation: boot-loader-spin 0.8s linear infinite;
      }
      @keyframes boot-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loader-spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
    <script>
      (() => {
        var STORAGE_KEY = "outfiqe-theme";
        var DARK_CLASS = "dark";
        try {
          var stored = localStorage.getItem(STORAGE_KEY);
          var isDark = stored
            ? stored === DARK_CLASS
            : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle(DARK_CLASS, isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-label="Loading">
        <div class="boot-loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
