packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 blocks dependency postinstall scripts by default (supply-chain
# guard). Each package must be explicitly allowed or denied here.
allowBuilds:
  esbuild: true
  prisma: true
  "@prisma/engines": true
  # Native TS path resolver used by eslint-plugin-import (pulled in by
  # eslint-config-next). No install-time side effects beyond compiling
  # its own native binding.
  unrs-resolver: true
  msw: true
  # CLI binary used for build-time sourcemap upload, which isn't wired up
  # here (no Sentry auth token configured) — not needed at runtime.
  "@sentry/cli": false
  msgpackr-extract: true
  sharp: true
  "@swc/core": true

# pnpm 11 also quarantines packages published within the last ~24h, so a
# compromised fresh release can't slip straight into your install.
# Anything listed here is explicitly exempted from that wait.
minimumReleaseAgeExclude:
  - tsx
  - "@tanstack/react-router@1.170.24"
  - "@tanstack/router-core@1.171.20"
  - "@tanstack/router-generator@1.167.26"
  - "@tanstack/router-plugin@1.168.28"
  - "@turbo/darwin-64@2.10.11"
  - "@turbo/darwin-arm64@2.10.11"
  - "@turbo/linux-64@2.10.11"
  - "@turbo/linux-arm64@2.10.11"
  - "@turbo/windows-64@2.10.11"
  - "@turbo/windows-arm64@2.10.11"
  - turbo@2.10.11
