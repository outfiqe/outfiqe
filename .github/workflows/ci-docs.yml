name: CI docs fast-path

on:
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change, the full gate is skipped
        run: echo "Documentation-only pull request — no build or tests to run."

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change, nothing to lint
        run: echo "Documentation-only pull request — no code to lint."

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change, nothing to type-check
        run: echo "Documentation-only pull request — no code to type-check."

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change, nothing to build
        run: echo "Documentation-only pull request — nothing to build."

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change, no unit tests to run
        run: echo "Documentation-only pull request — no unit tests to run."

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change, no integration tests to run
        run: echo "Documentation-only pull request — no integration tests to run."
