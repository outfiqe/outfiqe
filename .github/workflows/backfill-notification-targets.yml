name: Backfill notification targets

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report counts only, write nothing"
        type: boolean
        default: false

concurrency:
  group: backfill-notification-targets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    name: Backfill on the droplet
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Run the backfill against the deployed image
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /srv/outfiqe
            export IMAGE_TAG="${{ github.sha }}"
            DIRECT_URL="$(grep -E '^DIRECT_DATABASE_URL=' .env.prod | head -n1 | cut -d= -f2-)"
            DIRECT_URL="${DIRECT_URL%\"}"
            DIRECT_URL="${DIRECT_URL#\"}"
            DIRECT_URL="${DIRECT_URL%\'}"
            DIRECT_URL="${DIRECT_URL#\'}"

            docker compose -f docker-compose.prod.yml --env-file .env.prod pull api
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm \
              -e DATABASE_URL="$DIRECT_URL" \
              --entrypoint node_modules/.bin/tsx \
              api prisma/backfill-notification-targets.ts ${{ inputs.dry_run && '--dry-run' || '' }}
