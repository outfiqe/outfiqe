name: Validate Branch Name

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate-branch:
    name: Branch Naming
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          echo "Checking branch: $BRANCH -> $BASE"

          if [[ "$BASE" == "main" ]]; then
            if [[ "$BRANCH" == "dev" ]]; then
              echo "dev -> main is the release promotion path."
              exit 0
            fi
            echo "::error::Only 'dev' can PR into 'main' (the release promotion). Base your branch on 'dev' instead."
            exit 1
          fi

          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" || "$BRANCH" == "dev" ]]; then
            echo "::error::'$BRANCH' is a long-lived branch and cannot be the PR source here."
            exit 1
          fi
          if ! [[ "$BRANCH" =~ ^(feat|fix|docs|refactor|test|chore|build|ci|perf|style|revert)/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Branch name '$BRANCH' doesn't match '<type>/<short-kebab-case-description>' (see README: Code Quality & Commits)."
            exit 1
          fi
