name: Deploy prod

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build image and deploy to droplet
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve target commit
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/outfiqe-api:${{ steps.target.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/outfiqe-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migrate and deploy on the droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /srv/outfiqe
            export IMAGE_TAG="${{ steps.target.outputs.sha }}"
            DIRECT_URL="$(grep -E '^DIRECT_DATABASE_URL=' .env.prod | cut -d= -f2-)"

            docker compose -f docker-compose.prod.yml --env-file .env.prod pull

            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm \
              -e DATABASE_URL="$DIRECT_URL" \
              --entrypoint node_modules/.bin/prisma \
              api migrate deploy

            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans
            docker image prune -f

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "https://${{ secrets.API_DOMAIN }}/ready" >/dev/null; then
              echo "ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::service did not report ready within 150s"
          exit 1
