name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR instead of letting them queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Not real secrets — just enough for `prisma generate` and `tsc` to run
# without a live database. Nothing here connects to an actual Postgres
# instance; these checks are build/typecheck only.
#
# Sourced from repo Settings → Secrets and variables → Actions → Variables
# (vars.*), with a fallback baked in so CI still passes before those exist.
# See the "GitHub Variables" section in README for the exact values to set.

env:
  DATABASE_URL: ${{ vars.CI_DATABASE_URL || 'postgresql://outfiqe:outfiqe@localhost:5432/outfiqe_db?schema=public' }}
  JWT_SECRET: ${{ vars.CI_JWT_SECRET || 'ci-placeholder-secret-not-used-for-anything-real' }}
  API_URL: ${{ vars.CI_API_URL || 'http://localhost:4000' }}
  SITE_URL: ${{ vars.CI_SITE_URL || 'http://localhost:3000' }}
  VITE_API_URL: ${{ vars.CI_API_URL || 'http://localhost:4000' }}
  VITE_WEB_URL: ${{ vars.CI_SITE_URL || 'http://localhost:3000' }}
  NEXT_PUBLIC_ADMIN_URL: ${{ vars.CI_ADMIN_URL || 'http://localhost:5173' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - name: Check formatting
        run: pnpm format:check
      - name: Run ESLint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - name: Run tsc --noEmit
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - name: Build all packages
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: outfiqe
          POSTGRES_PASSWORD: outfiqe
          POSTGRES_DB: outfiqe_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outfiqe -d outfiqe_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://outfiqe:outfiqe@localhost:5432/outfiqe_test_db
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - name: Run unit + integration tests with coverage
        run: pnpm test

  commitlint:
    name: Commit Messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history needed so commitlint can walk the base..head range.
          fetch-depth: "0"
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - name: Validate commit messages
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
