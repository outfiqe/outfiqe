name: CI

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"

# Cancel superseded runs on the same branch/PR instead of letting them queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  API_URL: ${{ vars.CI_API_URL }}
  SITE_URL: ${{ vars.CI_SITE_URL }}
  VITE_WEB_URL: ${{ vars.CI_SITE_URL }}
  NEXT_PUBLIC_ADMIN_URL: ${{ vars.CI_ADMIN_URL }}
  NEXT_PUBLIC_APP_ENV: ${{ vars.CI_PUBLIC_APP_ENV }}
  VITE_APP_ENV: ${{ vars.CI_PUBLIC_APP_ENV }}

  APP_ENV: ${{ vars.CI_APP_ENV }}
  PROCESS_ROLE: ${{ vars.CI_PROCESS_ROLE }}
  PORT: ${{ vars.CI_PORT }}
  DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
  DATABASE_POOL_MAX: ${{ vars.CI_DATABASE_POOL_MAX }}
  JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
  JWT_ACCESS_TTL: ${{ vars.CI_JWT_ACCESS_TTL }}
  JWT_REFRESH_TTL: ${{ vars.CI_JWT_REFRESH_TTL }}
  MAIL_FROM: ${{ vars.CI_MAIL_FROM }}
  OPS_NOTIFICATION_EMAIL: ${{ vars.CI_OPS_NOTIFICATION_EMAIL }}
  FRONTEND_URL: ${{ vars.CI_FRONTEND_URL }}
  ADMIN_URL: ${{ vars.CI_API_ADMIN_URL }}
  ALLOWED_ORIGINS: ${{ vars.CI_ALLOWED_ORIGINS }}
  TENANT_BASE_DOMAIN: ${{ vars.CI_TENANT_BASE_DOMAIN }}
  API_PUBLIC_URL: ${{ vars.CI_API_PUBLIC_URL }}
  OAUTH_REDIRECT_BASE_URL: ${{ vars.CI_OAUTH_REDIRECT_BASE_URL }}
  STORAGE_DRIVER: ${{ vars.CI_STORAGE_DRIVER }}
  UPLOADS_DIR: ${{ vars.CI_UPLOADS_DIR }}
  REDIS_URL: ${{ vars.CI_REDIS_URL }}
  ESEWA_PRODUCT_CODE: ${{ vars.CI_ESEWA_PRODUCT_CODE }}
  ESEWA_SECRET_KEY: ${{ secrets.CI_ESEWA_SECRET_KEY }}
  ESEWA_BASE_URL: ${{ vars.CI_ESEWA_BASE_URL }}
  ESEWA_STATUS_URL: ${{ vars.CI_ESEWA_STATUS_URL }}
  KHALTI_BASE_URL: ${{ vars.CI_KHALTI_BASE_URL }}
  KHALTI_SECRET_KEY: ${{ secrets.CI_KHALTI_SECRET_KEY }}
  PASSWORD_BREACH_CHECK_ENABLED: ${{ vars.CI_PASSWORD_BREACH_CHECK_ENABLED }}
  CAPTCHA_ENABLED: ${{ vars.CI_CAPTCHA_ENABLED }}
  TURNSTILE_SECRET_KEY: ${{ secrets.CI_TURNSTILE_SECRET_KEY }}
  GOOGLE_CLIENT_ID: ${{ vars.CI_GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.CI_GOOGLE_CLIENT_SECRET }}
  FACEBOOK_APP_ID: ${{ vars.CI_FACEBOOK_APP_ID }}
  FACEBOOK_APP_SECRET: ${{ secrets.CI_FACEBOOK_APP_SECRET }}
  BANK_ACCOUNT_ENCRYPTION_KEY: ${{ secrets.CI_BANK_ACCOUNT_ENCRYPTION_KEY }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - name: Check formatting
        run: pnpm format:check
      - name: Run ESLint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - name: Run tsc --noEmit
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - name: Build all packages
        run: pnpm build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - name: Run unit tests (no coverage — fast feedback)
        run: pnpm test:unit

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_PWA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - name: Install Chromium
        run: pnpm --filter @outfiqe/web test:e2e:install
      - name: Build the web app with the service worker switched on
        run: pnpm exec turbo run build --filter=@outfiqe/web
      - name: Run browser tests
        run: pnpm --filter @outfiqe/web test:e2e
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: outfiqe
          POSTGRES_PASSWORD: outfiqe
          POSTGRES_DB: outfiqe_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outfiqe -d outfiqe_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data:rw
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://outfiqe:outfiqe@localhost:5432/outfiqe_test_db
      REDIS_URL: redis://localhost:6379
      INTEGRATION_WORKERS: "2"
      DATABASE_POOL_MAX: "5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - name: Run integration tests (no coverage)
        run: pnpm test:integration

  lighthouse:
    name: Lighthouse
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_PWA_ENABLED: "true"
      ADMIN_ORIGIN_URL: http://127.0.0.1:5173
      SITE_URL: http://127.0.0.1:3100
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - name: Install Chromium
        run: pnpm --filter @outfiqe/web test:e2e:install
      - name: Build the web app with the service worker switched on
        run: pnpm exec turbo run build --filter=@outfiqe/web
      - name: Run Lighthouse against the app shell
        run: pnpm --filter @outfiqe/web exec lhci autorun
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci
          retention-days: 7

  ci:
    name: CI
    if: always()
    needs: [lint, typecheck, build, unit, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required job succeeded
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "upstream results: $results"
          case ",$results," in
            *,failure,* | *,cancelled,* | *,skipped,*)
              echo "::error::a required CI job did not succeed"
              exit 1 ;;
          esac
          echo "all required jobs passed"
